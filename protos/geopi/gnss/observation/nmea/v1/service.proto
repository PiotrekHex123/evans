syntax = "proto3";

package geopi.gnss.observation.nmea.v1;

option csharp_namespace = "LeicaGeosystems.GeoPI.Gnss.Observation.Nmea.V1";
option java_package = "com.leica_geosystems.geopi.gnss.observation.nmea.v1";
option java_outer_classname = "ServiceProto";
option java_multiple_files = true;

// GNSS Nmea information
service GnssNmea {
  // Get NMEA stream from the sensor.
  rpc GetNmea(GetNmeaRequest) returns (stream GetNmeaResponse);
}

// A request message for GnssNmea.GetNmea
message GetNmeaRequest {
  // empty
}

// A response message for GnssNmea.GetNmea
message GetNmeaResponse {
  // Nmea string message
  repeated string nmea_messages = 1;
}
