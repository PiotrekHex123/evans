syntax = "proto3";

package geopi.gnss.settings.nmea.v1;

// Service error codes
enum ErrorCode {
  // Not specified, default value (must be zero).
  ERROR_CODE_UNSPECIFIED = 0;
  // Could not set NMEA streaming on the selected output (busy or not configured).
  ERROR_CODE_OUTPUT_UNAVAILABLE = 1;
  ERROR_CODE_RATE_NOT_SUPPORTED_BY_SENSOR = 2;
  ERROR_CODE_BUSY_CONNECTION = 3;
  ERROR_CODE_MESSAGE_OUT_OF_RANGE = 4;
  ERROR_CODE_STREAM_RATE_OUT_OF_RANGE = 5;
  ERROR_CODE_NMEA_VERSION_OUT_OF_RANGE = 6;
  ERROR_CODE_CONNECTION_OUT_OF_RANGE = 7;
}

// Detailed error info.
// To get ErrorCodeInfo, please refer to details of returned gRPC status.
message ErrorCodeInfo {
  // Code of an error.
  ErrorCode error_code = 1;
}
