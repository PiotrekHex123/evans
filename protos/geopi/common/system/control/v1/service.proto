syntax = "proto3";

package geopi.common.system.control.v1;

option csharp_namespace = "LeicaGeosystems.GeoPI.Common.System.Control.V1";
option java_package = "com.leica_geosystems.geopi.common.system.control.v1";
option java_outer_classname = "ServiceProto";
option java_multiple_files = true;

// Service for managing operational aspects of the sensor.
service SystemControl {
  // Reset user and system configurations.
  rpc SystemReset(SystemResetRequest) returns (SystemResetResponse);
}

// A request message for SystemControl.SystemReset
message SystemResetRequest {
  // empty
}

message SystemResetResponse {
  // empty
}
